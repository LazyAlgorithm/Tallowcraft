name: Import Quaternius CC0 assets
on:
  push:
    branches: [main]
    paths:
      - tools/import_quaternius.py
      - .github/workflows/import-quaternius.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and validate CC0 GLB assets
        run: python3 tools/import_quaternius.py
      - name: Commit validated assets directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Models/QuaterniusBaseCharacter.glb src/Models/QuaterniusBaseCharacter.glb.tmeta src/Models/QUATERNIUS_LICENSE.md src/Animations/QuaterniusUniversalLibrary.glb src/Animations/QuaterniusUniversalLibrary.glb.tmeta src/Animations/QuaterniusImport.json
          if ! git diff --cached --quiet; then
            git commit -m "Import Quaternius CC0 rigged player and Universal Animation Library assets"
            git push origin HEAD:main
          fi
